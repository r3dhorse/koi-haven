<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="water" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#E0EFFA"/>
      <stop offset="55%" stop-color="#88C8EC"/>
      <stop offset="100%" stop-color="#1271A6"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EAF4FB"/>
    </linearGradient>
    <radialGradient id="patch" cx="40%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FF5C68"/>
      <stop offset="100%" stop-color="#E63946"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#water)"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <g transform="translate(33 33) rotate(-15) scale(0.92)" stroke="#1E8DC6" stroke-opacity="0.35" stroke-width="0.8" stroke-linejoin="round">
    <!-- tail -->
    <path d="M-15 0 C-22 -9 -27 -10 -29 -7 C-26 -3 -26 3 -29 7 C-27 10 -22 9 -15 0 Z" fill="url(#body)"/>
    <!-- dorsal + pectoral fins -->
    <path d="M-2 -8 L3 -14 L8 -7 Z" fill="url(#body)"/>
    <path d="M5 6 L9 13 L13 6 Z" fill="url(#body)"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="18" ry="9" fill="url(#body)"/>
  </g>

  <g transform="translate(33 33) rotate(-15) scale(0.92)">
    <!-- kohaku patches -->
    <ellipse cx="7" cy="-2" rx="6.5" ry="4.2" fill="url(#patch)"/>
    <ellipse cx="-7" cy="1" rx="5.2" ry="3.6" fill="url(#patch)"/>
    <ellipse cx="0" cy="3.4" rx="2.8" ry="1.7" fill="#E2A03F"/>
    <!-- eye -->
    <circle cx="13.5" cy="-1.2" r="1.6" fill="#0B1B2B"/>
    <circle cx="14.1" cy="-1.8" r="0.55" fill="#ffffff"/>
  </g>

  <!-- bubbles -->
  <circle cx="47" cy="17" r="2.2" fill="#ffffff" fill-opacity="0.7"/>
  <circle cx="52" cy="23" r="1.3" fill="#ffffff" fill-opacity="0.55"/>
</svg>
